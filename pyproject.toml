[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-modeling-demo"
version = "0.1.0"
description = "A Windows 3D modeling prototype controlled with hand gestures."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==1.0.1",
  "opencv-python==4.14.0.94",
  "PySide6==6.11.2",
  "numpy>=2.0,<3",
  "panda3d==1.10.16",
  "trimesh==5.1.0",
  "manifold3d>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-qt>=4.5,<5",
  "pyinstaller==6.22.2",
]

[project.scripts]
hand-modeling-demo = "hand_modeling_demo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/hand_modeling_demo"]
addopts = "-ra"
